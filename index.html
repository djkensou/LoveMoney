<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoveMoney</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { margin: 0; background: #f4f5f7; color: #111; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .big { font-size: 28px; font-weight: 700; }
  .green { color: #0a8f4c; }
  .red { color: #d33; }
  .muted { color: #666; font-size: 13px; }
  button { border: 0; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .primary { background: #111; color: #fff; width: 100%; }
  .secondary { background: #eee; color: #111; }
  .danger { background: #ffe8e8; color: #c22; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; margin-bottom: 10px; background: #fff; }
  .movement { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
  .movement:last-child { border-bottom: 0; }
  .fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; }
  .hidden { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 10px; border-radius: 10px; background: #eee; text-align: center; font-weight: 600; }
  .tab.active { background: #111; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>LoveMoney</h1>
    <button class="secondary" onclick="exportCSV()">Exportar</button>
  </header>

  <div class="card">
    <div class="row">
      <button class="secondary" onclick="changeMonth(-1)">←</button>
      <strong id="monthLabel"></strong>
      <button class="secondary" onclick="changeMonth(1)">→</button>
    </div>
    <div class="row" style="margin-top:14px">
      <div>
        <div class="muted">Ingresos</div>
        <div class="big green" id="income"></div>
      </div>
      <div style="text-align:right">
        <div class="muted">Gastos</div>
        <div class="big red" id="expenses"></div>
      </div>
    </div>
    <hr>
    <div class="row">
      <div>
        <div class="muted">Balance</div>
        <div class="big" id="balance"></div>
      </div>
      <button class="secondary" onclick="openAdjust()">Ajustar saldo</button>
    </div>
  </div>

  <div class="card">
    <strong>Últimos movimientos</strong>
    <div id="movements"></div>
  </div>

  <button class="primary fab" onclick="openNew()">+ Nuevo movimiento</button>
</div>

<div id="newModal" class="hidden">
  <div class="card" style="margin-top:30px">
    <strong>Nuevo movimiento</strong>
    <div class="tabs">
      <div class="tab active" id="tabIncome" onclick="setType('income')">Ingreso</div>
      <div class="tab" id="tabExpense" onclick="setType('expense')">Gasto</div>
    </div>
    <input id="description" placeholder="Descripción">
    <input id="amount" type="number" inputmode="decimal" placeholder="Monto">
    <input id="date" type="date">
    <button class="primary" onclick="saveMovement()">Guardar</button>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="closeModals()">Cancelar</button>
  </div>
</div>

<div id="adjustModal" class="hidden">
  <div class="card" style="margin-top:30px">
    <strong>Ajustar saldo</strong>
    <p class="muted">Esto solo corrige el saldo. No crea un movimiento.</p>
    <input id="adjustAmount" type="number" inputmode="decimal" placeholder="Saldo actual">
    <button class="primary" onclick="saveAdjust()">Actualizar saldo</button>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="closeModals()">Volver sin cambios</button>
  </div>
</div>

<script>
let type = 'income';
let monthOffset = 0;
let data = JSON.parse(localStorage.getItem('lovemoney') || '{"movements":[],"adjustment":0}');

function money(n) {
  return '$' + Number(n || 0).toLocaleString('es-CL');
}

function monthKey() {
  const d = new Date();
  d.setMonth(d.getMonth() + monthOffset);
  return d.toISOString().slice(0, 7);
}

function currentMonthMovements() {
  return data.movements.filter(m => m.date.startsWith(monthKey()));
}

function render() {
  const list = currentMonthMovements();
  const income = list.filter(m => m.type === 'income').reduce((a, m) => a + Number(m.amount), 0);
  const expenses = list.filter(m => m.type === 'expense').reduce((a, m) => a + Number(m.amount), 0);
  const balance = income - expenses + Number(data.adjustment || 0);

  const d = new Date(monthKey() + '-01');
  document.getElementById('monthLabel').textContent =
    d.toLocaleDateString('es-CL', { month: 'long', year: 'numeric' });
  document.getElementById('income').textContent = money(income);
  document.getElementById('expenses').textContent = money(expenses);
  document.getElementById('balance').textContent = money(balance);
  document.getElementById('balance').className = 'big ' + (balance >= 0 ? 'green' : 'red');

  const container = document.getElementById('movements');
  container.innerHTML = list.length ? '' : '<p class="muted">Sin movimientos este mes.</p>';

  list.slice().reverse().forEach(m => {
    const div = document.createElement('div');
    div.className = 'movement';
    div.innerHTML = `
      <div>
        <strong>${m.description || (m.type === 'income' ? 'Ingreso' : 'Gasto')}</strong>
        <div class="muted">${m.date}</div>
      </div>
      <div style="text-align:right">
        <strong class="${m.type === 'income' ? 'green' : 'red'}">
          ${m.type === 'income' ? '+' : '-'}${money(m.amount)}
        </strong><br>
        <button class="danger" onclick="removeMovement('${m.id}')">Eliminar</button>
      </div>`;
    container.appendChild(div);
  });
}

function changeMonth(n) {
  monthOffset += n;
  render();
}

function openNew() {
  document.getElementById('newModal').classList.remove('hidden');
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
}

function openAdjust() {
  document.getElementById('adjustModal').classList.remove('hidden');
}

function closeModals() {
  document.getElementById('newModal').classList.add('hidden');
  document.getElementById('adjustModal').classList.add('hidden');
}

function setType(t) {
  type = t;
  document.getElementById('tabIncome').classList.toggle('active', t === 'income');
  document.getElementById('tabExpense').classList.toggle('active', t === 'expense');
}

function saveMovement() {
  const amount = Number(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  if (!amount || !date) return alert('Completa monto y fecha.');

  data.movements.push({
    id: Date.now().toString(),
    type,
    amount,
    date,
    description: document.getElementById('description').value
  });

  localStorage.setItem('lovemoney', JSON.stringify(data));
  document.getElementById('description').value = '';
  document.getElementById('amount').value = '';
  closeModals();
  render();
  if (type === 'income') playSound();
}

function saveAdjust() {
  data.adjustment = Number(document.getElementById('adjustAmount').value || 0);
  localStorage.setItem('lovemoney', JSON.stringify(data));
  closeModals();
  render();
}

function removeMovement(id) {
  if (!confirm('¿Eliminar este movimiento?')) return;
  data.movements = data.movements.filter(m => m.id !== id);
  localStorage.setItem('lovemoney', JSON.stringify(data));
  render();
}

function exportCSV() {
  const rows = [['Tipo','Descripción','Monto','Fecha']];
  data.movements.forEach(m => rows.push([m.type, m.description, m.amount, m.date]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lovemoney.csv';
  a.click();
}

function playSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
  osc.start();
  osc.stop(ctx.currentTime + 0.3);
}

render();
</script>
</body>
</html>
